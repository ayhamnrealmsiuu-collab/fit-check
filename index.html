const { useState, useRef, useEffect } = React;

function TiltCard({ children }) {
  const ref = useRef(null);
  const [tilt, setTilt] = useState({ x: 0, y: 0 });

  function onMouseMove(e) {
    const rect = ref.current.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width - 0.5;
    const py = (e.clientY - rect.top) / rect.height - 0.5;
    setTilt({ x: py * -14, y: px * 14 });
  }
  function onMouseLeave() {
    setTilt({ x: 0, y: 0 });
  }

  return (
    <div style={{ perspective: 1000 }}>
      <div
        ref={ref}
        onMouseMove={onMouseMove}
        onMouseLeave={onMouseLeave}
        style={{
          transform: `rotateX(${tilt.x}deg) rotateY(${tilt.y}deg)`,
          transition: "transform 0.15s ease-out",
          transformStyle: "preserve-3d",
          padding: 28,
          borderRadius: 20,
          border: "1px solid #1E2230",
          background: "rgba(255,255,255,0.03)",
          boxShadow: "0 20px 60px -20px rgba(164,94,255,0.35)",
        }}
      >
        {children}
      </div>
    </div>
  );
}

function SignupGate({ onSignedUp }) {
  const [email, setEmail] = useState("");
  const [status, setStatus] = useState("idle"); // idle | loading | error
  const [message, setMessage] = useState("");
  const [count, setCount] = useState(null);

  useEffect(() => {
    fetch("/api/stats")
      .then((r) => r.json())
      .then((data) => setCount(data.count || 0))
      .catch(() => setCount(null));
  }, []);

  async function handleSubmit(e) {
    e.preventDefault();
    if (!email.trim()) return;
    setStatus("loading");
    setMessage("");
    try {
      const res = await fetch("/api/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong");
      localStorage.setItem("fitcheck_email", email.trim().toLowerCase());
      onSignedUp();
    } catch (err) {
      setStatus("error");
      setMessage(err.message || "Signup failed, try again");
    }
  }

  return (
    <div
      style={{
        background: "radial-gradient(ellipse 900px 500px at 50% -5%, rgba(164,94,255,0.16), transparent 60%), radial-gradient(ellipse 700px 400px at 100% 20%, rgba(94,235,255,0.08), transparent 60%), #07070C",
        minHeight: "100vh",
        color: "#EDEFF4",
        fontFamily: "'Sora', system-ui, sans-serif",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        padding: 18,
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        .fc-display { font-family: 'Chakra Petch', sans-serif; letter-spacing: 0.02em; }
        .fc-mono { font-family: 'JetBrains Mono', monospace; }
        .fc-wordmark {
          font-family: 'Chakra Petch', sans-serif;
          font-weight: 900;
          text-align: center;
          background: linear-gradient(120deg, #5EEBFF 0%, #FF5EDB 25%, #A45EFF 50%, #C9FF3E 75%, #5EEBFF 100%);
          background-size: 300% 300%;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          filter: drop-shadow(0 0 22px rgba(164,94,255,0.35));
        }
        * { box-sizing: border-box; }
        body { margin: 0; }
      `}</style>

      <SparkleField />

      <div style={{ maxWidth: 380, width: "100%", textAlign: "center", position: "relative", zIndex: 1 }}>
        <div style={{ display: "flex", justifyContent: "center", alignItems: "flex-end", gap: 16, marginBottom: 6 }}>
          <HoloGarment guideKey="hoodie" size={58} duration="8.5s" floatDelay="0.2s" />
          <HoloGarment guideKey="shirt" size={78} duration="10s" floatDelay="0s" />
          <HoloGarment guideKey="pants" size={58} duration="9.2s" floatDelay="0.5s" />
        </div>
        <p className="fc-mono" style={{ fontSize: 9.5, color: "#4A5266", margin: "2px 0 0", textTransform: "uppercase", letterSpacing: "0.06em" }}>
          ‹ drag to spin ›
        </p>
        <h1 className="fc-wordmark" style={{ fontSize: "clamp(30px, 8vw, 44px)", lineHeight: 1, margin: "6px 0 10px" }}>
          FIT-CHECK
        </h1>
        <p className="fc-mono" style={{ fontSize: 12, color: "#8B93A6", margin: "0 0 28px", textTransform: "uppercase" }}>
          snap your closet. pick a vibe. we build the fit.
        </p>

        <TiltCard>
        <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input
            type="email"
            required
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            placeholder="your@email.com"
            style={{
              padding: "12px 14px",
              borderRadius: 10,
              border: "1px solid #1E2230",
              background: "#0B0C14",
              color: "#EDEFF4",
              fontSize: 14,
            }}
          />
          <button
            type="submit"
            disabled={status === "loading"}
            className="fc-btn"
            style={{
              padding: "12px 16px",
              borderRadius: 10,
              border: "none",
              background: "#C9FF3E",
              color: "#07070C",
              fontWeight: 700,
              fontSize: 14,
              cursor: "pointer",
            }}
          >
            {status === "loading" ? "Signing up..." : "Sign up & enter"}
          </button>
        </form>

        {status === "error" && (
          <p className="fc-mono" style={{ fontSize: 11, color: "#FF6B6B", margin: "10px 0 0" }}>
            {message}
          </p>
        )}
        {count !== null && (
          <p className="fc-mono" style={{ fontSize: 11, color: "#8B93A6", margin: "16px 0 0" }}>
            {count} {count === 1 ? "person has" : "people have"} signed up
          </p>
        )}
        </TiltCard>
      </div>
    </div>
  );
}

function Root() {
  const [signedUp, setSignedUp] = useState(
    () => !!localStorage.getItem("fitcheck_email")
  );

  if (!signedUp) {
    return <SignupGate onSignedUp={() => setSignedUp(true)} />;
  }
  return <FitCheck />;
}

// --- Browser-storage shim (replaces claude.ai's window.storage API) ---
const STORAGE_PREFIX = "fitcheck_v1_";
window.storage = {
  async get(key) {
    const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
    if (raw === null) throw new Error("Key not found");
    return { key, value: raw, shared: false };
  },
  async set(key, value) {
    try {
      window.localStorage.setItem(STORAGE_PREFIX + key, value);
      return { key, value, shared: false };
    } catch (err) {
      console.error("localStorage set failed:", err);
      return null;
    }
  },
  async delete(key) {
    window.localStorage.removeItem(STORAGE_PREFIX + key);
    return { key, deleted: true, shared: false };
  },
  async list(prefix = "") {
    const keys = [];
    for (let i = 0; i < window.localStorage.length; i++) {
      const k = window.localStorage.key(i);
      if (k && k.startsWith(STORAGE_PREFIX + prefix)) {
        keys.push(k.slice(STORAGE_PREFIX.length));
      }
    }
    return { keys, prefix, shared: false };
  },
};

const HOLO_GRADIENT = "linear-gradient(120deg, #5EEBFF 0%, #FF5EDB 25%, #A45EFF 50%, #C9FF3E 75%, #5EEBFF 100%)";
const HOLO_GRADIENT_BACK = "linear-gradient(120deg, #1B6E82 0%, #7A2E63 25%, #4B2E80 50%, #6B8A1E 75%, #1B6E82 100%)";

function HoloGarment({ guideKey, size = 92, duration = "9s", floatDelay = "0s" }) {
  const guide = GUIDES[guideKey];
  const d = guide?.mask?.[0];
  const [dragging, setDragging] = useState(false);
  const [angle, setAngle] = useState(0);
  const dragStartX = useRef(0);
  const dragStartAngle = useRef(0);

  if (!d) return null;
  const clip = `path('${d}')`;
  const scale = size / 100;

  function onPointerDown(e) {
    setDragging(true);
    dragStartX.current = e.clientX;
    dragStartAngle.current = angle;
    e.currentTarget.setPointerCapture?.(e.pointerId);
  }
  function onPointerMove(e) {
    if (!dragging) return;
    const delta = (e.clientX - dragStartX.current) * 1.4;
    setAngle(dragStartAngle.current + delta);
  }
  function onPointerUp() {
    setDragging(false);
  }

  return (
    <div
      className="fc-holo-float"
      style={{ width: size, height: size, position: "relative", animationDelay: floatDelay }}
    >
      <div
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerLeave={dragging ? undefined : onPointerUp}
        onPointerCancel={onPointerUp}
        style={{
          position: "absolute",
          top: 0,
          left: 0,
          width: 100,
          height: 100,
          transform: `scale(${scale})`,
          transformOrigin: "top left",
          perspective: 600,
          filter: "drop-shadow(0 8px 20px rgba(164,94,255,0.4))",
          touchAction: "none",
          cursor: dragging ? "grabbing" : "grab",
        }}
      >
        <div
          style={{
            width: "100%",
            height: "100%",
            position: "relative",
            transformStyle: "preserve-3d",
            transform: dragging ? `rotateY(${angle}deg)` : undefined,
            animation: dragging ? "none" : `fc-spinY ${duration} linear infinite`,
          }}
        >
          <div
            style={{
              position: "absolute",
              inset: 0,
              backfaceVisibility: "hidden",
              clipPath: clip,
              background: HOLO_GRADIENT,
              backgroundSize: "300% 300%",
              animation: "fc-holo-shift 5s linear infinite",
            }}
          />
          <div
            style={{
              position: "absolute",
              inset: 0,
              backfaceVisibility: "hidden",
              transform: "rotateY(180deg) scaleX(-1)",
              clipPath: clip,
              background: HOLO_GRADIENT_BACK,
              backgroundSize: "300% 300%",
              animation: "fc-holo-shift 5s linear infinite reverse",
              opacity: 0.9,
            }}
          />
        </div>
      </div>
    </div>
  );
}

const MAX_DIM = 1100;

async function resizeImage(file) {
  // Prefer createImageBitmap with imageOrientation so EXIF rotation
  // (very common on phone photos) is applied before we draw to canvas.
  // Without this, portrait photos can get sent to the model sideways
  // or upside-down, which is a common cause of clothes being misread.
  if (typeof createImageBitmap === "function") {
    try {
      const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
      let { width, height } = bitmap;
      if (width > height && width > MAX_DIM) {
        height = Math.round((height * MAX_DIM) / width);
        width = MAX_DIM;
      } else if (height > MAX_DIM) {
        width = Math.round((width * MAX_DIM) / height);
        height = MAX_DIM;
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(bitmap, 0, 0, width, height);
      return canvas.toDataURL("image/jpeg", 0.86);
    } catch (err) {
      console.error("createImageBitmap failed, falling back:", err);
      // fall through to the Image-based approach below
    }
  }

  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > MAX_DIM) {
          height = Math.round((height * MAX_DIM) / width);
          width = MAX_DIM;
        } else if (height > MAX_DIM) {
          width = Math.round((width * MAX_DIM) / height);
          height = MAX_DIM;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.86));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function callClaude(content, maxTokens, attempt = 1) {
  let response, data;
  try {
    response = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content, maxTokens }),
    });
    data = await response.json();
  } catch (networkErr) {
    if (attempt < 2) {
      await new Promise((r) => setTimeout(r, 800));
      return callClaude(content, maxTokens, attempt + 1);
    }
    throw new Error(`Network error: ${networkErr.message || "couldn't reach the server"}`);
  }

  if (!response.ok) {
    console.error("Claude API error, full response:", data);
    // Retry once on server-side/transient errors (5xx or overloaded), not on 4xx client errors
    if (attempt < 2 && (response.status >= 500 || response.status === 429)) {
      await new Promise((r) => setTimeout(r, 900));
      return callClaude(content, maxTokens, attempt + 1);
    }
    throw new Error(describeApiError(response.status, data));
  }

  const text = (data.content || [])
    .map((b) => b.text || "")
    .join("")
    .trim();

  if (!text) throw new Error("Empty response from model");
  return extractJson(text);
}

function describeApiError(status, data) {
  const parts = [`HTTP ${status}`];
  const msg = data?.error?.message || data?.message;
  if (msg) parts.push(msg);
  const type = data?.error?.type || data?.type;
  if (type) parts.push(`(${type})`);
  if (!msg && !type) {
    try {
      parts.push(JSON.stringify(data).slice(0, 300));
    } catch {
      parts.push(String(data).slice(0, 300));
    }
  }
  return parts.join(" — ");
}

function extractJson(rawText) {
  let text = rawText.trim();

  // Strip ```json ... ``` or ``` ... ``` fences if present
  const fenceMatch = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fenceMatch) text = fenceMatch[1].trim();

  // Normalize smart quotes that models sometimes emit inside "JSON-only" replies
  text = text.replace(/[""]/g, '"').replace(/['']/g, "'");

  const tryParse = (s) => {
    try {
      return JSON.parse(s);
    } catch {
      return null;
    }
  };

  // 1: parse as-is
  let parsed = tryParse(text);
  if (parsed) return parsed;

  // 2: grab the outermost { ... } span and retry
  const braceMatch = text.match(/\{[\s\S]*\}/);
  if (braceMatch) {
    parsed = tryParse(braceMatch[0]);
    if (parsed) return parsed;

    // 3: remove trailing commas before } or ] and retry (common model slip)
    const cleaned = braceMatch[0].replace(/,\s*([}\]])/g, "$1");
    parsed = tryParse(cleaned);
    if (parsed) return parsed;
  }

  const snippet = rawText.slice(0, 180).replace(/\s+/g, " ");
  throw new Error(`Response wasn't valid JSON. Got: "${snippet}${rawText.length > 180 ? "…" : ""}"`);
}

function SparkleField() {
  const canvasRef = useRef(null);
  const pointerRef = useRef({ x: -9999, y: -9999, active: false });

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const COLORS = ["#5EEBFF", "#FF5EDB", "#A45EFF", "#C9FF3E"];
    let particles = [];
    let raf;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const count = Math.max(20, Math.min(48, Math.floor((canvas.width * canvas.height) / 26000)));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
        r: Math.random() * 1.5 + 0.6,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        baseAlpha: Math.random() * 0.35 + 0.12,
      }));
    }
    resize();
    window.addEventListener("resize", resize);

    function onMove(e) {
      const t = e.touches && e.touches[0] ? e.touches[0] : e;
      if (t && typeof t.clientX === "number") {
        pointerRef.current = { x: t.clientX, y: t.clientY, active: true };
      }
    }
    function onLeave() {
      pointerRef.current.active = false;
    }
    window.addEventListener("pointermove", onMove, { passive: true });
    window.addEventListener("touchmove", onMove, { passive: true });
    window.addEventListener("pointerup", onLeave, { passive: true });
    window.addEventListener("touchend", onLeave, { passive: true });
    window.addEventListener("pointercancel", onLeave, { passive: true });

    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const p = pointerRef.current;
      for (const particle of particles) {
        particle.x += particle.vx;
        particle.y += particle.vy;
        if (particle.x < 0) particle.x = canvas.width;
        if (particle.x > canvas.width) particle.x = 0;
        if (particle.y < 0) particle.y = canvas.height;
        if (particle.y > canvas.height) particle.y = 0;

        let alpha = particle.baseAlpha;
        let radius = particle.r;

        if (p.active) {
          const dx = particle.x - p.x;
          const dy = particle.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const influence = 150;
          if (dist < influence) {
            const force = 1 - dist / influence;
            particle.x += (dx / dist) * force * 2.2;
            particle.y += (dy / dist) * force * 2.2;
            alpha = Math.min(1, alpha + force * 0.65);
            radius = particle.r + force * 2.4;
          }
        }

        ctx.beginPath();
        ctx.fillStyle = particle.color;
        ctx.globalAlpha = alpha;
        ctx.arc(particle.x, particle.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(tick);
    }
    tick();

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", resize);
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("touchmove", onMove);
      window.removeEventListener("pointerup", onLeave);
      window.removeEventListener("touchend", onLeave);
      window.removeEventListener("pointercancel", onLeave);
    };
  }, []);

  return (
    <canvas
      ref={canvasRef}
      style={{ position: "fixed", inset: 0, zIndex: 0, pointerEvents: "none" }}
    />
  );
}

    const bbox = guide.bbox || { x: 0, y: 0, w: 100, h: 100 };

    const rect = video.getBoundingClientRect();
    const containerAspect = rect.width / rect.height;
    const nativeW = video.videoWidth;
    const nativeH = video.videoHeight;
    const nativeAspect = nativeW / nativeH;

    // The video is displayed with object-fit: cover, so the visible native
    // pixel region is a centered crop of the full frame. Work out that
    // visible region first, then map the guide's percentage bbox onto it.
    let visibleW, visibleH, offsetX, offsetY;
    if (nativeAspect > containerAspect) {
      visibleH = nativeH;
      visibleW = nativeH * containerAspect;
      offsetX = (nativeW - visibleW) / 2;
      offsetY = 0;
    } else {
      visibleW = nativeW;
      visibleH = nativeW / containerAspect;
      offsetX = 0;
      offsetY = (nativeH - visibleH) / 2;
    }

    const cropX = offsetX + (bbox.x / 100) * visibleW;
    const cropY = offsetY + (bbox.y / 100) * visibleH;

    const cropH = (bbox.h / 100) * visibleH;

      outW = Math.round((outW * cap) / outH);

    }

    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(outW));
    canvas.height = Math.max(1, Math.round(outH));
    canvas

                    fontFamily: "'Chakra Petch', sans-serif",
                    fontSize: 18,
                    letterSpacing: "0.03em",
                    cursor: "pointer",
                  }}
                >
                  Use Photo
                </button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);

</script>
